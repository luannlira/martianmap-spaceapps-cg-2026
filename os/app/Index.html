<!DOCTYPE html>
<html lang="pt-BR">
<head>: <meta charset="utf-8">
<link rel="stylesheet" href="vendor/leaflet.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Martian Map — Survival OS</title>
<style>
:root{color-scheme:light dark;
--bg:#f3f3f3;--panel:#ffffff;--line:#d1d1d1;--text:#1b1b1b;--mute:#5f5f5f;
--accent:#0067c0;--onaccent:#ffffff;--dust:var(--accent);
--safe:#0f7b0f;--danger:#c42b1c;--hover:#e9e9e9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{
--bg:#202020;--panel:#2b2b2b;--line:#454545;--text:#ffffff;--mute:#c5c5c5;
--accent:#4cc2ff;--onaccent:#000000;--safe:#6ccb5f;--danger:#ff6b6b;--hover:#3a3a3a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dev{width:100%;max-width:440px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;border-inline:1px solid var(--line);background:var(--bg)}
h1,h2,h3{margin:0;font-weight:600;line-height:1.2}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px}
.status{display:flex;gap:12px;align-items:center}
.sat{min-height:44px;padding:0 12px;border-radius:4px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:8px}
.sat:hover{background:var(--hover)}
.sat i{width:10px;height:10px;border-radius:50%;background:var(--safe)}
.sat[aria-pressed="false"] i{background:var(--mute)}
.bat{color:var(--mute);font-variant-numeric:tabular-nums}
main{flex:1;padding:16px;overflow:auto}
section[hidden]{display:none}
.banner{padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--safe);border-radius:4px;background:var(--panel);margin-bottom:12px}
.banner b{display:block;font-size:16px;font-weight:600}
.banner span{color:var(--mute)}
.banner.crit{border-left-color:var(--danger)}
.map{height:400px;border-radius:4px;border:1px solid var(--line);background:var(--panel)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 0;color:var(--mute);font-size:14px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
details{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:8px}
summary{list-style:none;min-height:48px;padding:10px 14px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
summary:hover{background:var(--hover)}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:20px;color:var(--mute)}
details[open] summary::after{content:"–"}
.steps{padding:0 14px 8px;margin:0;list-style:none}
.steps label{display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:10px 0;border-top:1px solid var(--line)}
.steps input{width:20px;height:20px;flex:none;accent-color:var(--accent);margin-top:2px}
.steps input:checked+span{color:var(--mute);text-decoration:line-through}
.sim{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.sim p{margin:0 0 6px;color:var(--mute);font-size:14px}
.row{padding:8px 0;border-top:1px solid var(--line)}
.row label{display:flex;justify-content:space-between}
.row output{font-variant-numeric:tabular-nums;color:var(--mute)}
.row.bad output{color:var(--danger);font-weight:600}
.row input{width:100%;height:36px;accent-color:var(--accent)}
nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--panel)}
nav button{min-height:52px;border:0;background:transparent;font-size:15px;color:var(--mute);border-top:3px solid transparent}
nav button:hover{background:var(--hover)}
nav button[aria-selected="true"]{color:var(--accent);font-weight:600;border-top-color:var(--accent)}
.alert{position:fixed;z-index:20;top:50%;left:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 32px));display:none;flex-direction:column;gap:12px;padding:20px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-top:6px solid var(--danger);border-radius:6px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45),0 8px 32px rgba(0,0,0,.35)}
.alert.show{display:flex}
.alert h2{font-size:20px;color:var(--danger)}
.alert p{margin:0}
.alert button{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:4px;background:var(--hover);font-weight:600}
.alert button:hover{border-color:var(--mute)}
.alert #aRota{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
</style>
</head>
<body>
<div class="dev">
<header>
  <h1>Martian Map</h1>
  <div class="status">
    <button class="sat" id="sat" aria-pressed="true"><i></i><span id="satTxt">Satélite</span></button>
    <span class="bat" aria-label="Bateria">94%</span>
  </div>
</header>

<main>
  <section id="t-mapa" aria-label="Mapa">
    <div class="banner" id="banner"><b>Tudo normal</b><span>Nenhuma situação crítica detectada.</span></div>
    <div id="map" class="map" role="img" aria-label="Mapa da área com você, o abrigo e a zona de risco"></div>
    <p class="legend"><span><b style="background:var(--accent)"></b>Você</span><span><b style="background:var(--safe)"></b>Abrigo</span><span><b style="background:var(--danger)"></b>Risco</span></p>
    <p class="legend" id="offTxt" style="margin-top:6px">Mapa atualizado pelo satélite agora.</p>
  </section>

  <section id="t-guia" aria-label="Guia" hidden>
    <div id="guia"></div>
  </section>

  <section id="t-traje" aria-label="Traje" hidden>
    <div class="sim">
      <p>Valores simulados do traje. Mova os controles para testar um alerta.</p>
      <div id="sliders"></div>
    </div>
  </section>
</main>

<nav role="tablist" aria-label="Seções">
  <button role="tab" data-tab="mapa" aria-selected="true">Mapa</button>
  <button role="tab" data-tab="guia" aria-selected="false">Guia</button>
  <button role="tab" data-tab="traje" aria-selected="false">Traje</button>
</nav>
</div>

<div class="alert" id="alert" role="alertdialog" aria-labelledby="aT" aria-live="assertive">
  <h2 id="aT">Oxigênio baixo</h2>
  <p id="aD">Reserva abaixo do limite seguro.</p>
  <button id="aRota">Ver rota até o abrigo</button>
  <button class="alt" id="aGuia">Abrir checklist</button>
  <button class="alt" id="aOk">Dispensar</button>
</div>
<script src="vendor/leaflet.js"></script> 
<script>
/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- Mapa (Leaflet) ---------- */
// W e H DEVEM ser o tamanho real de assets/terreno.jpg (mudou a imagem? mude aqui também)
const W = 991, H = 991;
const limites = [[0, 0], [H, W]];
const mapa = L.map('map', { crs: L.CRS.Simple, minZoom: -1, maxZoom: 2 });
L.imageOverlay('assets/terreno.jpg', limites, {
  attribution: 'Imagem: https://trek.nasa.gov/mars/'
}).addTo(mapa);
mapa.fitBounds(limites);

// MOCK: posições e rota fixas, sem escala (px → metros) definida. Formato [y, x] em pixels da imagem.
const COR = { voce: css('--accent'), abrigo: css('--safe'), risco: css('--danger') };
L.circleMarker([150, 200], { radius: 10, color: COR.voce, fillColor: COR.voce, fillOpacity: 1 }).addTo(mapa).bindTooltip('Você');
L.circleMarker([830, 760], { radius: 10, color: COR.abrigo, fillColor: COR.abrigo, fillOpacity: 1 }).addTo(mapa).bindTooltip('Abrigo 2');
L.circle([420, 560], { radius: 130, color: COR.risco }).addTo(mapa).bindTooltip('Ladeira íngreme');

let rota = null;
function mostrarRota() {
  if (rota) return;
  rota = L.polyline(
    [[150,200],[300,230],[480,330],[650,420],[780,620],[830,760]],
    { color: '#ffffff', weight: 5, opacity: 1 }
  ).addTo(mapa);
}
function esconderRota() {
  if (rota) { mapa.removeLayer(rota); rota = null; }
}

/* ---------- Dados (PLACEHOLDER: procedimentos inventados, a validar com fontes da NASA) ---------- */
const GUIAS = [
  {id:'o2', t:'Pouco oxigênio', p:['Pare e sente-se para reduzir o consumo','Ative a reserva de emergência','Avise o abrigo mais próximo','Siga a rota segura até o abrigo']},
  {id:'pressao', t:'Perda de pressão', p:['Cubra o ponto de vazamento com o kit de reparo','Confira o manômetro do traje','Abra a válvula de reforço','Volte ao abrigo pela rota segura']},
  {id:'calor', t:'Temperatura alta', p:['Reduza o esforço físico','Ligue o resfriamento do traje','Procure sombra ou abrigo','Hidrate-se e avise a base']},
  {id:'poeira', t:'Tempestade de poeira', p:['Pare e fique de costas para o vento','Proteja o visor e os filtros','Ative a baliza de posição','Espere a visibilidade melhorar ou siga a rota']},
  {id:'comunicacao', t:'Perda de comunicação', p:['Teste o rádio em outro canal','Volte ao último ponto com sinal','Use o mapa offline para se orientar','Ligue a baliza de emergência']}
];
const SENS = [
  {k:'o2', l:'Reserva de O₂', u:'%', min:0, max:100, v:92, bad:v=>v<20, g:'o2', d:'Reserva abaixo do limite seguro.'},
  {k:'pressao', l:'Pressão do traje', u:' kPa', min:10, max:35, v:29, bad:v=>v<24, g:'pressao', d:'O traje está perdendo pressão.'},
  {k:'calor', l:'Temperatura interna', u:' °C', min:10, max:45, v:22, bad:v=>v>30, g:'calor', d:'Temperatura interna acima do limite.'},
  {k:'poeira', l:'Poeira no ar', u:'%', min:0, max:100, v:10, bad:v=>v>70, g:'poeira', d:'Visibilidade caindo rápido.'}
];

/* ---------- Abas ---------- */
function tab(n) {
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === n));
  ['mapa','guia','traje'].forEach(x => $('#t-' + x).hidden = x !== n);
  if (n === 'mapa') mapa.invalidateSize();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => tab(b.dataset.tab));

/* ---------- Montagem das telas (dados fixos: innerHTML é seguro aqui; use textContent se vierem de fora) ---------- */
$('#guia').innerHTML = GUIAS.map(g =>
  `<details id="g-${g.id}"><summary>${g.t}</summary><ul class="steps">${g.p.map(s =>
    `<li><label><input type="checkbox"><span>${s}</span></label></li>`).join('')}</ul></details>`
).join('');

$('#sliders').innerHTML = SENS.map(s =>
  `<div class="row" id="r-${s.k}"><label for="i-${s.k}">${s.l}<output id="o-${s.k}">${s.v}${s.u}</output></label><input type="range" id="i-${s.k}" min="${s.min}" max="${s.max}" value="${s.v}"></div>`
).join('');

/* ---------- Alertas ---------- */
let atual = null, dispensado = {}, ultimoFoco = null;

function checar() {
  let primeiro = null, algum = false;
  SENS.forEach(s => {
    const v = +$('#i-' + s.k).value;
    $('#o-' + s.k).textContent = v + s.u;
    const b = s.bad(v);
    $('#r-' + s.k).classList.toggle('bad', b);
    if (b) { algum = true; if (!primeiro && !dispensado[s.k]) primeiro = s; }
    else dispensado[s.k] = false;
  });
  if (primeiro && atual !== primeiro) disparar(primeiro);
  if (!algum) {
    atual = null;
    $('#banner').className = 'banner';
    $('#banner').innerHTML = '<b>Tudo normal</b><span>Nenhuma situação crítica detectada.</span>';
    esconderRota();
  }
}

function disparar(s) {
  ultimoFoco = document.activeElement;
  atual = s;
  const titulo = GUIAS.find(g => g.id === s.g).t;
  $('#aT').textContent = titulo;
  $('#aD').textContent = s.d;
  $('#alert').classList.add('show');
  $('#aRota').focus();
  navigator.vibrate && navigator.vibrate([250, 120, 250]);
  $('#banner').className = 'banner crit';
  $('#banner').innerHTML = '<b>Alerta: ' + titulo + '</b><span>Siga a rota até o Abrigo 2.</span>';
}

function fechar() {
  $('#alert').classList.remove('show');
  if (atual) dispensado[atual.k] = true;
  atual = null;
  if (ultimoFoco) ultimoFoco.focus();
}

document.querySelectorAll('#sliders input').forEach(i => i.oninput = checar);

$('#aRota').onclick = () => { mostrarRota(); fechar(); tab('mapa'); };
$('#aGuia').onclick = () => {
  const g = atual && atual.g;
  fechar();
  tab('guia');
  const d = $('#g-' + g);
  if (d) { d.open = true; d.scrollIntoView(); }
};
$('#aOk').onclick = fechar;

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#alert').classList.contains('show')) fechar();
});

/* ---------- Satélite (por enquanto só muda o texto) ---------- */
$('#sat').onclick = e => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', on);
  $('#satTxt').textContent = on ? 'Satélite' : 'Offline';
  $('#offTxt').textContent = on ? 'Mapa atualizado pelo satélite agora.' : 'Sem link. Usando o mapa salvo no dispositivo.';
};
</script>
</body>
</html>
